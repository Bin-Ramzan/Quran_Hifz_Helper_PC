name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Package installer and portable ZIP
        shell: pwsh
        run: |
          $versionMatch = Select-String -Path 'pubspec.yaml' -Pattern '^version:\s*(\d+\.\d+\.\d+)'
          if (-not $versionMatch) { throw 'Could not read the app version from pubspec.yaml.' }
          $version = $versionMatch.Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $compiler "/DAppVersion=$version" 'windows\installer.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path 'build\windows\x64\runner\Release\*' -DestinationPath "dist\Quran-Revision-Companion-$version-windows-x64-portable.zip" -CompressionLevel Optimal

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: quran-revision-companion-installer
          path: dist/*-Setup-*.exe
          if-no-files-found: error

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: quran-revision-companion-portable
          path: dist/*-portable.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*-Setup-*.exe
            dist/*-portable.zip